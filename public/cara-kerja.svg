<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="judul">
  <title id="judul">Alur pemeriksaan pengaduan Circle T</title>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1B4F9C"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .kotak { fill: #FFFFFF; stroke: #1B4F9C; stroke-width: 2; }
      .aksen { fill: #F4711F; stroke: #F4711F; stroke-width: 2; }
      .garis { fill: none; stroke: #1B4F9C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#panah); }
      .judul { font-size: 18px; font-weight: 700; fill: #1B4F9C; text-anchor: middle; }
      .judul-putih { font-size: 22px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .sub-putih { font-size: 14px; fill: #FFFFFF; fill-opacity: 0.9; text-anchor: middle; }
      .pil { fill: #EAF1FB; stroke: #1B4F9C; stroke-width: 1; }
      .pil-teks { font-size: 14px; font-weight: 600; fill: #1B4F9C; text-anchor: middle; }
      .ikon { fill: none; stroke: #1B4F9C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .ikon-putih { fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Panah: dua sumber ke AI Agent, AI Agent ke hasil, hasil bercabang ke dua keluaran -->
  <path class="garis" d="M250 110 H285 V210 H318"/>
  <path class="garis" d="M250 390 H285 V290 H318"/>
  <path class="garis" d="M540 250 H618"/>
  <path class="garis" d="M800 250 H835 V120 H868"/>
  <path class="garis" d="M800 250 H835 V380 H868"/>

  <!-- Sumber: Laporan Warga -->
  <rect class="kotak" x="20" y="60" width="230" height="100" rx="14"/>
  <g class="ikon" transform="translate(120 76) scale(1.15)">
    <path d="M4 0 h14 l6 6 v20 a2 2 0 0 1 -2 2 h-18 a2 2 0 0 1 -2 -2 v-24 a2 2 0 0 1 2 -2 z"/>
    <path d="M18 0 v6 h6"/>
    <path d="M7 13 h10 M7 18 h10 M7 23 h6"/>
  </g>
  <text class="judul" x="135" y="141">Laporan Warga</text>

  <!-- Sumber: Data Perjalanan Truk -->
  <rect class="kotak" x="20" y="340" width="230" height="100" rx="14"/>
  <g class="ikon" transform="translate(113 358) scale(1.15)">
    <path d="M1 4 h20 v16 h-20 z"/>
    <path d="M21 9 h8 l6 6 v5 h-14 z"/>
    <circle cx="8" cy="23" r="3"/>
    <circle cx="28" cy="23" r="3"/>
  </g>
  <text class="judul" x="135" y="421">Data Perjalanan Truk</text>

  <!-- AI Agent Circle T -->
  <rect class="aksen" x="320" y="150" width="220" height="200" rx="18"/>
  <g class="ikon-putih" transform="translate(406 176) scale(1.3)">
    <rect x="2" y="10" width="32" height="24" rx="6"/>
    <path d="M18 10 V4 M14 4 h8"/>
    <circle cx="12" cy="22" r="2.5" fill="#FFFFFF" stroke="none"/>
    <circle cx="24" cy="22" r="2.5" fill="#FFFFFF" stroke="none"/>
    <path d="M12 29 h12"/>
  </g>
  <text class="judul-putih" x="430" y="272">AI Agent Circle T</text>
  <text class="sub-putih" x="430" y="302">Mencocokkan dan memeriksa</text>

  <!-- Hasil Pemeriksaan -->
  <rect class="kotak" x="620" y="120" width="180" height="260" rx="14"/>
  <text class="judul" x="710" y="164">Hasil Pemeriksaan</text>
  <rect class="pil" x="635" y="190" width="150" height="36" rx="18"/>
  <text class="pil-teks" x="710" y="213">Terbukti</text>
  <rect class="pil" x="635" y="240" width="150" height="36" rx="18"/>
  <text class="pil-teks" x="710" y="263">Tidak Terbukti</text>
  <rect class="pil" x="635" y="290" width="150" height="36" rx="18"/>
  <text class="pil-teks" x="710" y="313">Sedang Diperiksa</text>

  <!-- Keluaran: Dashboard -->
  <rect class="kotak" x="870" y="70" width="120" height="100" rx="14"/>
  <g class="ikon" transform="translate(914 86) scale(1.15)">
    <rect x="1" y="1" width="26" height="17" rx="3"/>
    <path d="M9 24 h10 M14 18 v6"/>
  </g>
  <text class="judul" x="930" y="151">Dashboard</text>

  <!-- Keluaran: Telegram -->
  <rect class="kotak" x="870" y="330" width="120" height="100" rx="14"/>
  <g class="ikon" transform="translate(914 346) scale(1.15)">
    <path d="M26 2 L2 12 l9 3 l3 9 z"/>
    <path d="M11 15 l15 -13"/>
  </g>
  <text class="judul" x="930" y="411">Telegram</text>
</svg>
